<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AutoDock Pipeline{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif;
           background: #0f1117; color: #e0e0e0; min-height: 100vh; }

    /* Nav */
    nav { background: #1a1d26; border-bottom: 1px solid #2d3147;
          padding: 0 1.5rem; display: flex; align-items: center;
          height: 52px; gap: 2rem; }
    nav .brand { font-weight: 700; font-size: 1.1rem;
                 color: #7eb8f7; letter-spacing: 0.03em; }
    nav a { color: #9ca3af; text-decoration: none; font-size: 0.9rem;
            padding: 0.3rem 0.6rem; border-radius: 4px;
            transition: color 0.15s, background 0.15s; }
    nav a:hover, nav a.active { color: #e0e0e0; background: #2d3147; }
    nav .spacer { flex: 1; }
    nav .status-dot { width: 8px; height: 8px; border-radius: 50%;
                      background: #22c55e; display: inline-block;
                      margin-right: 0.4rem; }

    /* Layout */
    main { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 1.2rem;
         color: #f0f0f0; }
    h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.8rem;
         color: #d0d0d0; }

    /* Cards */
    .card { background: #1a1d26; border: 1px solid #2d3147;
            border-radius: 8px; padding: 1.2rem; margin-bottom: 1rem; }
    .card-row { display: grid; gap: 1rem;
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

    /* Stats */
    .stat { text-align: center; }
    .stat .val { font-size: 2rem; font-weight: 700; color: #7eb8f7; }
    .stat .lbl { font-size: 0.8rem; color: #6b7280; margin-top: 0.2rem; }

    /* Tables */
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th { text-align: left; padding: 0.5rem 0.75rem; color: #6b7280;
         font-weight: 500; border-bottom: 1px solid #2d3147;
         cursor: pointer; user-select: none; }
    th:hover { color: #9ca3af; }
    td { padding: 0.5rem 0.75rem; border-bottom: 1px solid #1e2130; }
    tr:hover td { background: #1e2130; }
    .sort-asc::after  { content: " ↑"; }
    .sort-desc::after { content: " ↓"; }

    /* Badges */
    .badge { display: inline-block; padding: 0.15rem 0.5rem;
             border-radius: 999px; font-size: 0.75rem; font-weight: 500; }
    .badge-green  { background: #14532d; color: #4ade80; }
    .badge-yellow { background: #713f12; color: #fbbf24; }
    .badge-red    { background: #7f1d1d; color: #f87171; }
    .badge-blue   { background: #1e3a5f; color: #7eb8f7; }
    .badge-gray   { background: #1f2937; color: #9ca3af; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; gap: 0.4rem;
           padding: 0.45rem 1rem; border-radius: 6px; border: none;
           cursor: pointer; font-size: 0.88rem; font-weight: 500;
           transition: opacity 0.15s; }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary  { background: #2563eb; color: #fff; }
    .btn-success  { background: #16a34a; color: #fff; }
    .btn-danger   { background: #dc2626; color: #fff; }
    .btn-ghost    { background: #2d3147; color: #d0d0d0; }

    /* Forms */
    .form-group { margin-bottom: 0.8rem; }
    label { display: block; font-size: 0.82rem; color: #9ca3af;
            margin-bottom: 0.3rem; }
    input[type=text], input[type=number], select {
      width: 100%; background: #0f1117; border: 1px solid #2d3147;
      color: #e0e0e0; border-radius: 6px; padding: 0.45rem 0.7rem;
      font-size: 0.88rem; }
    input:focus, select:focus { outline: none; border-color: #2563eb; }
    .form-row { display: flex; gap: 1rem; align-items: flex-end;
                flex-wrap: wrap; }
    .form-row .form-group { flex: 1; min-width: 120px; }

    /* Drop zone */
    .drop-zone { border: 2px dashed #2d3147; border-radius: 8px;
                 padding: 2rem; text-align: center; color: #6b7280;
                 cursor: pointer; transition: border-color 0.2s; }
    .drop-zone:hover, .drop-zone.drag { border-color: #2563eb;
                                         color: #9ca3af; }
    .drop-zone input[type=file] { display: none; }

    /* Toast */
    #toast { position: fixed; bottom: 1.5rem; right: 1.5rem;
             background: #1a1d26; border: 1px solid #2d3147;
             border-radius: 8px; padding: 0.8rem 1.2rem;
             font-size: 0.88rem; opacity: 0; transition: opacity 0.3s;
             pointer-events: none; max-width: 320px; z-index: 100; }
    #toast.show { opacity: 1; }
    #toast.ok  { border-color: #16a34a; color: #4ade80; }
    #toast.err { border-color: #dc2626; color: #f87171; }

    /* Misc */
    .muted { color: #6b7280; font-size: 0.82rem; }
    .mt1 { margin-top: 1rem; }
    .flex { display: flex; gap: 0.6rem; align-items: center; }
    .score-good { color: #4ade80; }
    .score-ok   { color: #fbbf24; }
    .score-bad  { color: #f87171; }
    .clash      { color: #f87171; }
  </style>
</head>
<body>
<nav>
  <span class="brand">⚗ AutoDock</span>
  <a href="/"          class="{% if request.endpoint=='dashboard'       %}active{% endif %}">Dashboard</a>
  <a href="/library"   class="{% if request.endpoint=='library_page'    %}active{% endif %}">Library</a>
  <a href="/receptors" class="{% if request.endpoint=='receptors_page'  %}active{% endif %}">Receptors</a>
  <a href="/dock"      class="{% if request.endpoint=='dock_page'       %}active{% endif %}">Docking</a>
  <a href="/queue"     class="{% if request.endpoint=='queue_page'      %}active{% endif %}">Queue</a>
  <span class="spacer"></span>
  <span class="muted" id="clock"></span>
</nav>

<main>{% block content %}{% endblock %}</main>

<div id="toast"></div>

<script>
// Clock
setInterval(() => {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString();
}, 1000);

// Toast helper
function toast(msg, ok=true) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + (ok ? 'ok' : 'err');
  setTimeout(() => t.className = '', 3000);
}

// Sortable tables
document.querySelectorAll('th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const table = th.closest('table');
    const col   = [...th.parentElement.children].indexOf(th);
    const asc   = !th.classList.contains('sort-asc');
    table.querySelectorAll('th').forEach(h =>
      h.classList.remove('sort-asc','sort-desc'));
    th.classList.add(asc ? 'sort-asc' : 'sort-desc');
    const tbody = table.querySelector('tbody');
    const rows  = [...tbody.querySelectorAll('tr')];
    rows.sort((a, b) => {
      const av = a.children[col]?.dataset.val ?? a.children[col]?.textContent ?? '';
      const bv = b.children[col]?.dataset.val ?? b.children[col]?.textContent ?? '';
      const an = parseFloat(av), bn = parseFloat(bv);
      if (!isNaN(an) && !isNaN(bn)) return asc ? an-bn : bn-an;
      return asc ? av.localeCompare(bv) : bv.localeCompare(av);
    });
    rows.forEach(r => tbody.appendChild(r));
  });
});

// Drop zone
document.querySelectorAll('.drop-zone').forEach(zone => {
  zone.addEventListener('click', () => zone.querySelector('input').click());
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('drag');
    const input = zone.querySelector('input');
    input.files = e.dataTransfer.files;
    input.dispatchEvent(new Event('change'));
  });
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
